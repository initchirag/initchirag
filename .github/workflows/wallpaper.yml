name: Profile Wallpaper

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wallpaper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Update README wallpaper
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          wallpaper_dir = Path("randomizer/wallpapers")
          readme = Path("README.md")

          # Get wallpapers in fixed order
          wallpapers = sorted(
              list(wallpaper_dir.glob("*.jpg")) +
              list(wallpaper_dir.glob("*.jpeg")),
              key=lambda p: p.name.lower()
          )

          if not wallpapers:
              raise SystemExit("ERROR: No wallpapers found.")

          print("Wallpapers:")
          for i, wallpaper in enumerate(wallpapers):
              print(f"{i}: {wallpaper.name}")

          # Read README
          text = readme.read_text(encoding="utf-8")

          # Find the currently displayed wallpaper
          current_match = re.search(
              r'\./randomizer/wallpapers/([^"\s>]+\.(?:jpg|jpeg))',
              text,
              re.IGNORECASE
          )

          current = current_match.group(1) if current_match else None

          print(f"Current wallpaper: {current}")

          # Find current wallpaper index
          current_index = -1

          if current:
              for i, wallpaper in enumerate(wallpapers):
                  if wallpaper.name.lower() == current.lower():
                      current_index = i
                      break

          # Select NEXT wallpaper
          next_index = (current_index + 1) % len(wallpapers)
          selected = wallpapers[next_index]

          print(f"New wallpaper: {selected.name}")

          # ------------------------------------------------
          # REMOVE ALL OLD WALLPAPER MARKUP
          # ------------------------------------------------

          # Remove WALLPAPER_START ... WALLPAPER_END blocks
          text = re.sub(
              r'<!-- WALLPAPER_START -->.*?<!-- WALLPAPER_END -->',
              '',
              text,
              flags=re.DOTALL
          )

          # Remove any old wallpaper <img> tags
          text = re.sub(
              r'<img[^>]*src=["\']\./randomizer/wallpapers/[^"\']+["\'][^>]*>',
              '',
              text,
              flags=re.IGNORECASE
          )

          # Remove empty centered paragraphs left behind
          text = re.sub(
              r'<p\s+align=["\']center["\']>\s*</p>',
              '',
              text,
              flags=re.IGNORECASE
          )

          # Clean excessive blank lines
          text = re.sub(r'\n{3,}', '\n\n', text).strip()

          # ------------------------------------------------
          # ADD ONLY THE NEW WALLPAPER
          # ------------------------------------------------

          wallpaper_block = f"""<!-- WALLPAPER_START -->

          <p align="center">
            <img src="./randomizer/wallpapers/{selected.name}" width="100%" alt="Random wallpaper">
          </p>

          <!-- WALLPAPER_END -->"""

          updated = wallpaper_block + "\n\n" + text + "\n"

          # Save README
          readme.write_text(updated, encoding="utf-8")

          print("README now contains ONLY:")
          print(selected.name)
          PY

      - name: Commit README update
        shell: bash
        run: |
          git config user.name "initchirag"
          git config user.email "grepchiragsingh7@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README change."
          else
            git commit -m "🖼️ Update profile wallpaper"
            git push
          fi
