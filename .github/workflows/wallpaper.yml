name: Random README Wallpaper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  random-wallpaper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select random wallpaper
        shell: bash
        run: |
          wallpapers=(randomizer/wallpapers/*.jpg)

          if [ ${#wallpapers[@]} -eq 0 ]; then
            echo "No JPG wallpapers found!"
            exit 1
          fi

          random_wallpaper=${wallpapers[$RANDOM % ${#wallpapers[@]}]}
          filename=$(basename "$random_wallpaper")

          echo "Selected wallpaper: $filename"

          python - <<PY
          from pathlib import Path
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          image = f'<img src="./randomizer/wallpapers/{filename}" width="100%" />'

          pattern = r'<!-- WALLPAPER_START -->.*?<!-- WALLPAPER_END -->'

          replacement = (
              '<!-- WALLPAPER_START -->\n'
              f'{image}\n'
              '<!-- WALLPAPER_END -->'
          )

          new_text, count = re.subn(
              pattern,
              replacement,
              text,
              flags=re.DOTALL
          )

          if count == 0:
              raise SystemExit(
                  "Wallpaper markers not found in README.md"
              )

          readme.write_text(new_text, encoding="utf-8")
          PY

      - name: Commit README change
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "🖼️ Change README wallpaper"
            git push
          fi
