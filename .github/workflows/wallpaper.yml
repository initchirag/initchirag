name: Random README Wallpaper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  change-wallpaper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Select random wallpaper
        shell: bash
        run: |
          wallpapers=(randomizer/wallpapers/*.jpg)

          if [ ${#wallpapers[@]} -eq 0 ]; then
            echo "ERROR: No JPG wallpapers found!"
            exit 1
          fi

          # Get the wallpaper currently shown in README
          current=$(grep -oE 'randomizer/wallpapers/[^"]+\.jpg' README.md | head -n 1 || true)

          # Create list excluding current wallpaper
          available=()

          for wallpaper in "${wallpapers[@]}"; do
            if [ "$wallpaper" != "$current" ]; then
              available+=("$wallpaper")
            fi
          done

          # If there is only one wallpaper, use it
          if [ ${#available[@]} -eq 0 ]; then
            available=("${wallpapers[@]}")
          fi

          # Pick random wallpaper
          random_wallpaper="${available[$RANDOM % ${#available[@]}]}"
          filename=$(basename "$random_wallpaper")

          echo "Selected wallpaper: $filename"

          # Update README
          FILENAME="$filename" python3 <<'PY'
          from pathlib import Path
          import os
          import re

          readme = Path("README.md")
          text = readme.read_text(encoding="utf-8")

          filename = os.environ["FILENAME"]

          new_image = (
              f'<img src="./randomizer/wallpapers/{filename}" '
              f'width="100%" alt="Random wallpaper" />'
          )

          pattern = (
              r'<!-- WALLPAPER_START -->'
              r'.*?'
              r'<!-- WALLPAPER_END -->'
          )

          replacement = (
              '<!-- WALLPAPER_START -->\n'
              f'{new_image}\n'
              '<!-- WALLPAPER_END -->'
          )

          updated, count = re.subn(
              pattern,
              replacement,
              text,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  "ERROR: Wallpaper markers not found in README.md"
              )

          readme.write_text(updated, encoding="utf-8")
          PY

      - name: Commit README change
        run: |
          git config user.name "initchirag"
          git config user.email "grepchiragsingh7@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "🖼️ Update README wallpaper"
            git push
          fi
