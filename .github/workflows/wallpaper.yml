name: Random Profile Wallpaper

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wallpaper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Change wallpaper
        run: |
          python3 <<'PY'
          from pathlib import Path
          import random
          import re

          wallpaper_dir = Path("randomizer/wallpapers")
          readme = Path("README.md")

          wallpapers = sorted(
              list(wallpaper_dir.glob("*.jpg")) +
              list(wallpaper_dir.glob("*.jpeg"))
          )

          if not wallpapers:
              raise SystemExit("No JPG wallpapers found.")

          text = readme.read_text(encoding="utf-8")

          # Find current wallpaper
          match = re.search(
              r'randomizer/wallpapers/([^"]+\.(?:jpg|jpeg))',
              text,
              re.IGNORECASE
          )

          current = match.group(1) if match else None

          # Don't immediately select the same wallpaper
          choices = [
              wallpaper
              for wallpaper in wallpapers
              if wallpaper.name != current
          ]

          if not choices:
              choices = wallpapers

          selected = random.choice(choices)

          print(f"Current wallpaper: {current}")
          print(f"New wallpaper: {selected.name}")

          new_block = f"""<!-- WALLPAPER_START -->

          <p align="center">
            <img src="./randomizer/wallpapers/{selected.name}" width="100%" alt="Random wallpaper">
          </p>

          <!-- WALLPAPER_END -->"""

          pattern = r'<!-- WALLPAPER_START -->.*?<!-- WALLPAPER_END -->'

          updated, count = re.subn(
              pattern,
              new_block,
              text,
              count=1,
              flags=re.DOTALL
          )

          if count != 1:
              raise SystemExit(
                  "README markers not found."
              )

          readme.write_text(updated, encoding="utf-8")

          print("README updated successfully.")
          PY

      - name: Commit changes
        run: |
          git config user.name "initchirag"
          git config user.email "grepchiragsingh7@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No changes."
          else
            git commit -m "🖼️ Update profile wallpaper"
            git push
          fi
