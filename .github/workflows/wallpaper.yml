name: Profile Wallpaper

on:
  schedule:
    - cron: "*/20 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wallpaper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Change README wallpaper
        shell: bash
        run: |
          python3 <<'PY'
          from pathlib import Path
          import re

          wallpaper_dir = Path("randomizer/wallpapers")
          readme = Path("README.md")

          # Find all JPG and JPEG wallpapers
          wallpapers = sorted(
              list(wallpaper_dir.glob("*.jpg")) +
              list(wallpaper_dir.glob("*.jpeg")),
              key=lambda p: p.name.lower()
          )

          if not wallpapers:
              raise SystemExit(
                  "ERROR: No JPG/JPEG wallpapers found in "
                  "randomizer/wallpapers/"
              )

          print("Wallpaper queue:")
          for i, wallpaper in enumerate(wallpapers, start=1):
              print(f"{i}. {wallpaper.name}")

          # Read README
          text = readme.read_text(encoding="utf-8")

          # Find currently displayed wallpaper
          current_match = re.search(
              r'\./randomizer/wallpapers/([^"\s>]+\.(?:jpg|jpeg))',
              text,
              re.IGNORECASE
          )

          current = current_match.group(1) if current_match else None

          print(f"Current wallpaper: {current}")

          # Find current wallpaper's position
          current_index = -1

          if current:
              for i, wallpaper in enumerate(wallpapers):
                  if wallpaper.name.lower() == current.lower():
                      current_index = i
                      break

          # Move to the NEXT wallpaper in order
          next_index = (current_index + 1) % len(wallpapers)
          selected = wallpapers[next_index]

          print(f"Next wallpaper: {selected.name}")

          # New centered wallpaper block
          wallpaper_block = f"""<!-- WALLPAPER_START -->

          <p align="center">
            <img src="./randomizer/wallpapers/{selected.name}" width="100%" alt="Random wallpaper">
          </p>

          <!-- WALLPAPER_END -->"""

          # Find existing wallpaper block
          pattern = (
              r'<!-- WALLPAPER_START -->'
              r'.*?'
              r'<!-- WALLPAPER_END -->'
          )

          if re.search(pattern, text, flags=re.DOTALL):
              # Replace existing wallpaper
              updated = re.sub(
                  pattern,
                  wallpaper_block,
                  text,
                  count=1,
                  flags=re.DOTALL
              )

              print("Wallpaper changed successfully.")

          else:
              # Create wallpaper block
              updated = wallpaper_block + "\n\n" + text

              print("No wallpaper block found.")
              print("Created wallpaper block.")

          # Save README
          readme.write_text(updated, encoding="utf-8")

          print("README updated successfully.")
          PY

      - name: Commit README update
        shell: bash
        run: |
          git config user.name "initchirag"
          git config user.email "grepchiragsingh7@gmail.com"

          git add README.md

          if git diff --cached --quiet; then
            echo "No README change."
          else
            git commit -m "🖼️ Update profile wallpaper"
            git push
          fi
